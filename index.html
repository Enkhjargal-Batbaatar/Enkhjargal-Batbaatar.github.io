<!DOCTYPE html>
<html lang="mn" class="gate-open">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#e5ded5">

<!-- link preview (Messenger, Facebook, Viber, WhatsApp). Absolute URLs:
     scrapers do not resolve relative ones. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Batbaatar &amp; Enkhjargal">
<meta property="og:title" content="Batbaatar &amp; Enkhjargal | Хуримын урилга">
<meta property="og:description" content="2026 оны 9 дүгээр сарын 28, Даваа гараг · 9:00 цаг — Увс аймаг, Тэс сум.">
<meta property="og:url" content="https://enkhjargal-batbaatar.github.io/">
<meta property="og:locale" content="mn_MN">
<meta property="og:image" content="https://enkhjargal-batbaatar.github.io/assets/img/share.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Батбаатар, Энхжаргал хоёр">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Batbaatar &amp; Enkhjargal | Хуримын урилга">
<meta name="twitter:description" content="2026 оны 9 дүгээр сарын 28, Даваа гараг · 9:00 цаг — Увс аймаг, Тэс сум.">
<meta name="twitter:image" content="https://enkhjargal-batbaatar.github.io/assets/img/share.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Mrs+Saint+Delafield&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=20260913">
</head>
<body>

<div class="progress-dots" id="progressDots">
  <span class="dot active" data-target="verse"></span>
  <span class="dot" data-target="photo"></span>
  <span class="dot" data-target="venue"></span>
  <span class="dot" data-target="closing"></span>
</div>

<!-- ============ INTRO GATE (tap anywhere -> film, then straight into the page) ============ -->
<div class="intro-gate" id="introGate">
  <video
    id="introVideo"
    class="intro-video"
    poster="assets/video/poster.jpg"
    playsinline
    webkit-playsinline
    muted
    preload="auto"
  >
    <source src="assets/video/intro.webm" type="video/webm">
    <source src="assets/video/intro.mp4" type="video/mp4">
  </video>

  <!-- the music outlives the film: it keeps playing into the page below -->
  <audio id="introAudio" preload="auto">
    <source src="assets/audio/music.m4a" type="audio/mp4">
    <source src="assets/audio/music.mp3" type="audio/mpeg">
  </audio>

  <button class="intro-tap-layer" id="introTap" type="button">
    <span class="tap-ring"></span>
    <span class="tap-hint" id="tapHint"></span>
  </button>

  <p class="intro-loading" id="introLoading"></p>
  <button class="skip-hint" id="skipHint" type="button"></button>
</div>

<main class="scroller" id="scroller">

  <!-- 0. VERSE -->
  <section class="panel" id="verse">
    <img class="reveal posy" src="assets/img/posy.webp" alt="" width="620" height="254">
    <div class="verse-text" id="verseText"></div>
  </section>

  <!-- 1. THE COUPLE + CEREMONY DATE -->
  <section class="panel" id="photo">
    <img class="reveal arch-photo" src="assets/img/arch-photo.webp" alt="Батбаатар, Энхжаргал хоёр" width="680" height="986">

    <p class="reveal caps ceremony-label" style="--d:1" id="ceremonyLabel"></p>

    <div class="reveal date-block" style="--d:2">
      <div class="day-row">
        <span class="weekday" id="dateWeekday"></span>
        <span class="date-col">
          <span class="month" id="dateMonth"></span>
          <span class="day-num" id="dateDay"></span>
        </span>
        <span class="time-col">
          <span class="time-value" id="dateTime"></span>
          <span class="time-label" id="dateTimeLabel"></span>
        </span>
      </div>
      <p class="year" id="dateYear"></p>
    </div>

    <p class="reveal place-line" style="--d:3" id="placeLine"></p>

    <span class="scroll-cue" aria-hidden="true"></span>
  </section>

  <!-- 3. VENUE + COUNTDOWN -->
  <section class="panel venue-panel" id="venue">
    <img class="branch branch-a" src="assets/img/branch-a.webp" alt="" width="380" height="479">
    <img class="branch branch-b" src="assets/img/branch-b.webp" alt="" width="300" height="552">

    <div class="reveal detail-block" style="--d:1">
      <h3 class="detail-title" id="whereTitle"></h3>
      <p class="detail-sub" id="whereAddress"></p>
      <a class="detail-map-link" id="whereMapLink" href="#" target="_blank" rel="noopener"></a>
    </div>

    <div class="reveal countdown" style="--d:2" id="countdown">
      <p class="countdown-label" id="countdownLabel"></p>
      <div class="countdown-row" id="countdownRow">
        <span class="cd-unit"><span class="cd-num" id="cdDays">–</span><span class="cd-cap" id="cdDaysCap"></span></span>
        <span class="cd-unit"><span class="cd-num" id="cdHours">–</span><span class="cd-cap" id="cdHoursCap"></span></span>
        <span class="cd-unit"><span class="cd-num" id="cdMins">–</span><span class="cd-cap" id="cdMinsCap"></span></span>
        <span class="cd-unit"><span class="cd-num" id="cdSecs">–</span><span class="cd-cap" id="cdSecsCap"></span></span>
      </div>
    </div>
  </section>

  <!-- 5. CLOSING -->
  <section class="panel" id="closing">
    <div class="reveal ornate-frame">
      <img src="assets/img/ornate-frame.webp" alt="" width="620" height="872">
      <div class="frame-shine"></div>
      <div class="ornate-names">
        <span id="closingNameA"></span>
        <span class="amp">&amp;</span>
        <span id="closingNameB"></span>
      </div>
    </div>
  </section>

</main>

<script src="assets/js/content.js?v=20260913"></script>
<script src="assets/js/script.js?v=20260913"></script>
</body>
</html>

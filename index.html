<!DOCTYPE html>
<html lang="en" class="gate-open">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Батбаатар &amp; Энхжаргал | We're Getting Married</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Bad+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="progress-dots" id="progressDots">
  <span class="dot active" data-target="photo"></span>
  <span class="dot" data-target="timeline"></span>
  <span class="dot" data-target="details"></span>
  <span class="dot" data-target="rsvp"></span>
  <span class="dot" data-target="closing"></span>
</div>

<!-- ============ 1. INTRO GATE (tap anywhere -> video + sound) ============ -->
<div class="intro-gate" id="introGate">
  <video
    id="introVideo"
    class="intro-video"
    poster="assets/video/poster.jpg"
    playsinline
    webkit-playsinline
    preload="auto"
  >
    <source src="assets/video/intro.webm" type="video/webm">
    <source src="assets/video/intro.mp4" type="video/mp4">
  </video>

  <button class="intro-tap-layer" id="introTap" type="button">
    <span class="tap-ring"></span>
    <span class="tap-hint" id="tapHint"></span>
  </button>

  <p class="intro-loading" id="introLoading"></p>
  <button class="skip-hint" id="skipHint" type="button"></button>
</div>

<main class="scroller" id="scroller">

  <!-- 3. PHOTO + SAVE THE DATE -->
  <section class="panel photo-panel" id="photo">
    <div class="arch-frame reveal">
      <svg class="arch-outline" viewBox="0 0 260 340" preserveAspectRatio="none">
        <path d="M8,340 L8,120 A122,122 0 0 1 252,120 L252,340" fill="none" stroke="#a68f6f" stroke-width="1.4"/>
      </svg>
      <div class="arch-photo">
        <svg viewBox="0 0 260 320" preserveAspectRatio="xMidYMid slice" class="scene-art">
          <defs>
            <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f6c98f"/>
              <stop offset="0.45" stop-color="#eda36f"/>
              <stop offset="1" stop-color="#c97a63"/>
            </linearGradient>
            <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#e79b6f"/>
              <stop offset="1" stop-color="#9c6a63"/>
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="260" height="190" fill="url(#skyGrad)"/>
          <circle cx="185" cy="95" r="26" fill="#fff3d6" opacity="0.9"/>
          <path d="M0,150 L60,120 L120,140 L170,110 L260,150 L260,190 L0,190 Z" fill="#8a5a4f" opacity="0.55"/>
          <rect x="0" y="190" width="260" height="130" fill="url(#seaGrad)"/>
          <path d="M0,205 Q40,198 80,206 T160,206 T260,204 L260,320 L0,320 Z" fill="#7a4f49" opacity="0.35"/>
          <g stroke="#fff4dd" stroke-width="1" opacity="0.35">
            <line x1="0" y1="230" x2="260" y2="230"/>
            <line x1="0" y1="255" x2="260" y2="255"/>
            <line x1="0" y1="280" x2="260" y2="280"/>
          </g>
          <g transform="translate(130,150)" fill="#f6efe3" opacity="0.92">
            <path d="M-34,4 C-34,-14 -20,-24 -10,-16 C-4,-22 6,-22 10,-14 C22,-22 34,-10 30,4 C24,20 4,32 0,38 C-4,32 -28,20 -34,4 Z"/>
          </g>
        </svg>
      </div>
    </div>

    <p class="reveal caption-line" style="--d:1" id="celebrationLine"></p>

    <div class="reveal date-block" style="--d:2">
      <p class="month" id="dateMonth"></p>
      <p class="day-row"><span id="dateWeekday"></span><span class="day-num" id="dateDay"></span><span id="dateTime"></span></p>
      <p class="year" id="dateYear"></p>
    </div>

    <p class="reveal reception-line" style="--d:3" id="receptionLine"></p>
  </section>

  <!-- 4. TIMELINE -->
  <section class="panel rose-bg" id="timeline">
    <div class="reveal floral-divider">
      <svg viewBox="0 0 220 90" class="floral-bouquet"><use href="#floral-bouquet-art"/></svg>
    </div>
    <h2 class="reveal script-heading" style="--d:1" id="timelineHeading"></h2>

    <ul class="reveal timeline-list" style="--d:2" id="timelineList"></ul>
  </section>

  <!-- 5. DETAILS -->
  <section class="panel rose-bg" id="details">
    <h2 class="reveal details-heading">
      <span class="sans" id="detailsHeadingSans"></span>
      <span class="script" id="detailsHeadingScript"></span>
    </h2>

    <div class="reveal detail-block" style="--d:1">
      <h3 class="detail-title" id="registryTitle"></h3>
      <div class="qr-row" id="registryRow"></div>
    </div>

    <div class="reveal detail-block" style="--d:2">
      <h3 class="detail-title" id="dressCodeTitle"></h3>
      <div class="hearts-row">
        <svg viewBox="0 0 40 36" class="heart heart-1"><use href="#heart-shape"/></svg>
        <svg viewBox="0 0 40 36" class="heart heart-2"><use href="#heart-shape"/></svg>
        <svg viewBox="0 0 40 36" class="heart heart-3"><use href="#heart-shape"/></svg>
      </div>
      <p class="detail-sub" id="dressCodeLabel"></p>
    </div>

    <div class="reveal detail-block" style="--d:3">
      <h3 class="detail-title" id="hotelTitle"></h3>
      <p class="detail-sub multiline" id="hotelLines"></p>
    </div>
  </section>

  <!-- 6. RSVP -->
  <section class="panel rsvp-panel" id="rsvp">
    <div class="leaf-branch leaf-tl"><svg viewBox="0 0 140 140"><use href="#leaf-branch-art"/></svg></div>
    <div class="leaf-branch leaf-br"><svg viewBox="0 0 140 140"><use href="#leaf-branch-art"/></svg></div>

    <p class="reveal please-script" id="rsvpPlease"></p>
    <h2 class="reveal rsvp-title" style="--d:1">R S<br>V P</h2>
    <p class="reveal rsvp-by" style="--d:2" id="rsvpBy"></p>
    <p class="reveal rsvp-email" style="--d:2" id="rsvpEmail"></p>
    <p class="reveal rsvp-note" style="--d:3" id="rsvpNote"></p>

    <form class="reveal rsvp-form" id="rsvpForm" style="--d:4">
      <input type="text" name="guestName" id="rsvpNameInput" required>
      <div class="attend-row">
        <label><input type="radio" name="attending" id="rsvpAttendYes" checked> <span id="rsvpAttendYesLabel"></span></label>
        <label><input type="radio" name="attending" id="rsvpAttendNo"> <span id="rsvpAttendNoLabel"></span></label>
      </div>
      <input type="number" name="guestCount" min="1" max="10" id="rsvpGuestsInput">
      <textarea name="message" id="rsvpMessageInput" rows="2"></textarea>
      <button type="submit" id="rsvpSubmitBtn"></button>
    </form>
    <p class="rsvp-thanks" id="rsvpThanks"></p>
  </section>

  <!-- 7. CLOSING -->
  <section class="panel cover" id="closing">
    <div class="reveal ornate-frame">
      <svg viewBox="0 0 260 360" class="ornate-svg"><use href="#ornate-frame-art"/></svg>
      <div class="frame-shine"></div>
      <div class="ornate-names">
        <span id="closingNameA"></span>
        <span class="amp">&amp;</span>
        <span id="closingNameB"></span>
      </div>
    </div>
  </section>

</main>

<script src="assets/js/content.js"></script>

</body>
</html>

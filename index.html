<!DOCTYPE html>
<html lang="mn" class="gate-open">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Batbaatar &amp; Enkhjargal | Хуримын урилга</title>
<meta name="description" content="Батбаатар, Энхжаргал хоёрын хуримын ёслолын урилга — 2026 оны 9 дүгээр сарын 28, Увс аймаг, Тэс сум.">
<meta name="theme-color" content="#e5ded5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Mrs+Saint+Delafield&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="progress-dots" id="progressDots">
  <span class="dot active" data-target="photo"></span>
  <span class="dot" data-target="timeline"></span>
  <span class="dot" data-target="details"></span>
  <span class="dot" data-target="rsvp"></span>
  <span class="dot" data-target="closing"></span>
</div>

<!-- ============ INTRO GATE (tap anywhere -> film, then straight into the page) ============ -->
<div class="intro-gate" id="introGate">
  <video
    id="introVideo"
    class="intro-video"
    poster="assets/video/poster.jpg"
    playsinline
    webkit-playsinline
    preload="auto"
  >
    <source src="assets/video/intro.webm" type="video/webm">
    <source src="assets/video/intro.mp4" type="video/mp4">
  </video>

  <button class="intro-tap-layer" id="introTap" type="button">
    <span class="tap-ring"></span>
    <span class="tap-hint" id="tapHint"></span>
  </button>

  <p class="intro-loading" id="introLoading"></p>
  <button class="skip-hint" id="skipHint" type="button"></button>
</div>

<main class="scroller" id="scroller">

  <!-- 1. THE COUPLE + CEREMONY DATE -->
  <section class="panel" id="photo">
    <img class="reveal arch-photo" src="assets/img/arch-photo.webp" alt="Батбаатар, Энхжаргал хоёр" width="680" height="986">

    <p class="reveal caps ceremony-label" style="--d:1" id="ceremonyLabel"></p>

    <div class="reveal date-block" style="--d:2">
      <p class="month" id="dateMonth"></p>
      <p class="day-row">
        <span id="dateWeekday"></span>
        <span class="day-num" id="dateDay"></span>
        <span id="dateTime"></span>
      </p>
      <p class="year" id="dateYear"></p>
    </div>

    <p class="reveal caps place-line" style="--d:3" id="placeLine"></p>

    <span class="scroll-cue" aria-hidden="true"></span>
  </section>

  <!-- 2. TIMELINE -->
  <section class="panel" id="timeline">
    <img class="reveal posy" src="assets/img/posy.webp" alt="" width="620" height="254">
    <img class="reveal title-img title-timeline" style="--d:1" src="assets/img/timeline-title.webp" alt="Timeline" width="520" height="178">
    <ul class="reveal timeline-list" style="--d:2" id="timelineList"></ul>
  </section>

  <!-- 3. DETAILS -->
  <section class="panel" id="details">
    <img class="reveal title-img title-details" src="assets/img/details-title.webp" alt="The details" width="440" height="299">

    <div class="reveal detail-block" style="--d:1">
      <h3 class="detail-title" id="whereTitle"></h3>
      <p class="detail-sub" id="whereLines"></p>
    </div>

    <div class="reveal detail-block" style="--d:2">
      <h3 class="detail-title" id="dressTitle"></h3>
      <img class="hearts" src="assets/img/hearts.webp" alt="" width="330" height="134">
      <p class="detail-sub caps-sub" id="dressLabel"></p>
    </div>

    <div class="reveal detail-block" style="--d:3">
      <h3 class="detail-title" id="whenTitle"></h3>
      <p class="detail-sub" id="whenLines"></p>
    </div>
  </section>

  <!-- 4. RSVP -->
  <section class="panel rsvp-panel" id="rsvp">
    <img class="branch branch-a" src="assets/img/branch-a.webp" alt="" width="380" height="479">
    <img class="branch branch-b" src="assets/img/branch-b.webp" alt="" width="300" height="552">

    <img class="reveal rsvp-title" src="assets/img/rsvp-title.webp" alt="Please RSVP" width="460" height="499">
    <p class="reveal rsvp-by" style="--d:1" id="rsvpBy"></p>
    <a class="reveal rsvp-email" style="--d:2" id="rsvpEmail" href="#"></a>
    <p class="reveal rsvp-note" style="--d:3" id="rsvpNote"></p>
  </section>

  <!-- 5. CLOSING -->
  <section class="panel" id="closing">
    <div class="reveal ornate-frame">
      <img src="assets/img/ornate-frame.webp" alt="" width="620" height="872">
      <div class="frame-shine"></div>
      <div class="ornate-names">
        <span id="closingNameA"></span>
        <span class="amp">&amp;</span>
        <span id="closingNameB"></span>
      </div>
    </div>
  </section>

</main>

<script src="assets/js/content.js"></script>
<script src="assets/js/script.js"></script>
</body>
</html>
